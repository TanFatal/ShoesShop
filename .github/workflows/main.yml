name: CI/CD to AWS EC2 with Docker

on:
  push:
    branches:
      - Duytan  # Chạy khi push code lên nhánh main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Set up Java 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 3. Build JAR file với Maven
    - name: Build JAR
      run: mvn clean package -DskipTests

    # 4. Login DockerHub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 5. Build & Push Docker image
    - name: Build and Push Docker image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/shoesshop:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/shoesshop:latest

    # 6. SSH vào AWS và deploy
    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        script: |
          cd /backend/ShoesShop
          docker stop springboot-app
          docker rm springboot-app
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/shoesshop:latest
          docker-compose up -d --no-deps --build springboot-app
          docker-compose up -d --no-deps --build prometheus
          docker-compose up -d --no-deps --build grafana
