
server:
  port: 8088
  servlet:
    context-path: /test
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/testting
    username: ${DB_HOST}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
jwt:
  auth:
    app: ShoesShop
    secret_key: ${JWT_KEY}
    expires_in: 86400
