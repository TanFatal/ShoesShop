version: '3.8'

services:
  database:
    image: mysql:8.0.33
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: testting
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456" ]
      interval: 5s
      retries: 10
      timeout: 5s

  app:
    image: duytanpn/springboot-app:latest
    build: .
    container_name: springboot-app
    depends_on:
      - database
    ports:
      - "8088:8088"
    env_file: 
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/testting
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SERVER_PORT: 8088
      SERVER_SERVLET_CONTEXT_PATH: /test
    command: sh -c "./wait-for-it.sh database:3306 -- sleep 30 && java -jar app.jar"